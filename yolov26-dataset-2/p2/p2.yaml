# YOLO26n + P2 detection head  (SADECE P2 - SPD-Conv YOK)
#
# Baseline (duz yolo26n) ile TEK fark: stride-4 P2 tespit dali eklendi.
# Detect 3 seviyeden 4 seviyeye cikti -> [P2/4, P3/8, P4/16, P5/32].
# Backbone, tum downsample'lar (duz Conv), derinlik/genislik carpanlari ve
# P3-P4-P5 kollari baseline ile BIREBIR AYNI. Boylece ablasyonun tek
# degiskeni "P2 dali" olur.
#
# SPD-Conv-P2/spd-covn-p2.yaml ile FARKI: orada butun stride-2 katmanlar
# SPDConv'du, yani o kosu iki degiskenli (SPD-Conv + P2). Bu dosya P2'nin
# TEK BASINA ne kattigini olcer; ikisi birlikte SPD-Conv'un P2 uzerine ne
# ekledigini de ayirmayi saglar.
#
# P2 NEDEN: modules_v2.py'deki etiket istatistigine gore valid/test'in
# ~%38-39'u kucuk nesne (<32px). Stride-4 dali tam bu dagilimi hedefliyor.
#
# MALIYET UYARISI: P2 dali stride-4 seviyesinde calisir, yani P3'un 4 kati
# aktivasyon alani. Parametre ve VRAM belirgin artar; CUDA OOM alirsan
# batch'i dusur.

nc: 2 # crack, dent (dataset2 / ke-project-yolo-tb1l6)
      # baseline nc=2 ile egitildi; 80 birakilirsa Detect'in sinif dali shape
      # tutmaz ve baseline'in egitilmis head'i .load() sirasinda TRANSFER OLMAZ.
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone - baseline ile BIREBIR AYNI (duz Conv)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 P2 backbone <-- YENI HEAD DALI BURADAN BESLENIYOR
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 P3 backbone
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]     # 9
  - [-1, 2, C2PSA, [1024]]                # 10 P5 backbone

# YOLO26n head + P2 dali
#
# NOT: 0-16 arasi katmanlar baseline ile AYNI indekste ve ayni sekilde
# (backbone 0-10 + head 11-16). Bu yuzden baseline agirliklari o araliga
# birebir transfer olur. 17. katmandan itibaren (P2 upsample kolu) yapi
# ayrisir; oradan sonrasi ve 4 seviyeli Detect rastgele baslar.
head:
  # --- Top-down: P5 -> P4 -> P3 -> P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                   # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                   # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 <-- P2 kolu buradan basliyor
  - [[-1, 2], 1, Concat, [1]]                    # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]]                   # 19 P2/4-xsmall (DETECT KAYNAGI)

  # --- Bottom-up: P2 -> P3 -> P4 -> P5 (duz Conv) ---
  - [-1, 1, Conv, [128, 3, 2]]                   # 20 P2 -> P3
  - [[-1, 16], 1, Concat, [1]]                   # 21 cat head P3 (top-down, katman 16)
  - [-1, 2, C3k2, [256, True]]                   # 22 P3/8-small (DETECT KAYNAGI)

  - [-1, 1, Conv, [256, 3, 2]]                   # 23 P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                   # 24 cat head P4 (top-down, katman 13)
  - [-1, 2, C3k2, [512, True]]                   # 25 P4/16-medium (DETECT KAYNAGI)

  - [-1, 1, Conv, [512, 3, 2]]                   # 26 P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                   # 27 cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 28 P5/32-large (DETECT KAYNAGI)

  - [[19, 22, 25, 28], 1, Detect, [nc]]          # 29 Detect(P2, P3, P4, P5)
