# YOLO26n + P2 detection head + SPD-Conv
#
# Onceki P2-head yaml'inin butun stride-2 downsample katmanlari (hem
# backbone'da hem head'in bottom-up kolunda) SPDConv ile degistirildi.
# Amac: P2 head'in kazandirdigi yuksek cozunurluklu (4x) tespit imkanini,
# SPDConv'un downsample'da bilgi kaybetmeyen (space-to-depth) yapisiyla
# birlestirmek - ozellikle P2 seviyesinde (en ince crack'lerin gorundugu
# yer) SPDConv'un normal stride-2 conv'a gore avantaji en cok burada
# hissedilir, cunku bu seviyede kaybedilecek detay en fazla.
#
# Parser-safe tasarim: SPDConv gercek Ultralytics-uyumlu bir modul,
# custom registrasyon disinda (nasil SPDConv'u daha once register
# ettiysen) hicbir ozel islem gerekmiyor. P2 head, Concat/Conv/C3k2/Upsample
# gibi tamamen standart moduller kullaniyor - parse_model sorunu yok.
#
# MALIYET UYARISI: P2 head zaten VRAM/sure maliyetini artiriyordu, SPDConv
# da backbone'un ilk katmanlarinda kanal sayisini fiili olarak buyuten bir
# yapi (space-to-depth) oldugu icin bu ikisi bir araya gelince maliyet daha
# da artabilir. batch size'i izle, gerekirse dusur.

nc: 2 # crack, dent (dataset2 / ke-project-yolo-tb1l6)
      # baseline nc=2 ile egitildi; 80 birakilirsa Detect'in sinif dali shape
      # tutmaz ve baseline'in egitilmis head'i .load() sirasinda TRANSFER OLMAZ.
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (SPD-Conv ile)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SPDConv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, SPDConv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 P2 backbone <-- YENI HEAD DALI BURADAN BESLENIYOR
  - [-1, 1, SPDConv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 P3 backbone
  - [-1, 1, SPDConv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 P4 backbone
  - [-1, 1, SPDConv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]     # 9
  - [-1, 2, C2PSA, [1024]]                # 10 P5 backbone

# YOLO26n head (P2 dali + SPD-Conv bottom-up downsample'lar)
head:
  # --- Top-down: P5 -> P4 -> P3 -> P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]              # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]             # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]               # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]              # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]]               # 19 P2/4-xsmall (DETECT KAYNAGI)

  # --- Bottom-up: P2 -> P3 -> P4 -> P5 (SPD-Conv ile) ---
  - [-1, 1, SPDConv, [128, 3, 2]]              # 20 P2 -> P3
  - [[-1, 16], 1, Concat, [1]]                  # 21 cat head P3 (top-down, katman 16)
  - [-1, 2, C3k2, [256, True]]                   # 22 P3/8-small (DETECT KAYNAGI)

  - [-1, 1, SPDConv, [256, 3, 2]]                 # 23 P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                      # 24 cat head P4 (top-down, katman 13)
  - [-1, 2, C3k2, [512, True]]                       # 25 P4/16-medium (DETECT KAYNAGI)

  - [-1, 1, SPDConv, [512, 3, 2]]                      # 26 P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                           # 27 cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]                # 28 P5/32-large (DETECT KAYNAGI)

  - [[19, 22, 25, 28], 1, Detect, [nc]]                     # 29 Detect(P2, P3, P4, P5)