# YOLO26 + BiFPN neck
# Referans: Tan et al., "EfficientDet: Scalable and Efficient Object Detection",
#           CVPR 2020 - Sec. 3.2 (weighted bidirectional feature pyramid).
#
# Baseline (duz yolo26n) ile TEK fark neck'teki fuzyon:
#   1) duz `Concat`  ->  ogrenilebilir agirlikli `WeightedConcat` (bifpn.py)
#   2) P4 cikis dugumune backbone kisayolu -> 3 girisli fuzyon
# Backbone, derinlik/genislik carpanlari, head kanallari ve Detect AYNI kaldi;
# boylece ablasyon tek degiskenli olur.
#
# `patch_concat_to_bifpn()` YOLO(...) cagrisindan ONCE calistirilmali.

# PARAMETERS
nc: 2                # crack, dent  (dataset2 / ke-project-yolo-tb1l6)
                     # baseline nc=2 ile egitildi; burada 80 birakilirsa
                     # Detect'in sinif dali shape tutmaz ve baseline'in
                     # egitilmis head'i .load() sirasinda TRANSFER OLMAZ.
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# BACKBONE  (baseline ile birebir ayni)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  <- P3_in
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]     # 6  <- P4_in
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 9
  - [-1, 2, C2PSA, [1024]]         # 10 <- P5_in

# HEAD - BiFPN blogu (top-down + bottom-up, agirlikli fuzyon)
#
#   P5_in (10) ---------------------------------------> P5_out (22)
#                 \                                    /
#   P4_in  (6) -----> P4_td (13) ----------> P4_out (19)
#                 \        \               /       /
#   P3_in  (4) -------------> P3_out (16) --------
#
# P5'in top-down ara dugumu yoktur (piramidin tepesi = girisin kendisi),
# P3'un de bottom-up ara dugumu yoktur (tabani). BiFPN'in "tek girisli
# dugumu at" kurali geregi bu iki dugum 2 girisli; tek 3 girisli dugum
# P4_out ve BiFPN'i PANet'ten ayiran sey de tam olarak o kisayol.
head:
  # --- top-down: P5 -> P4 -> P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12  P4_td = w*up(P5_in) + w*P4_in
  - [-1, 2, C3k2, [512, True]]                   # 13  P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15  P3_out = w*up(P4_td) + w*P3_in
  - [-1, 2, C3k2, [256, True]]                   # 16  P3_out  -> Detect

  # --- bottom-up: P3 -> P4 -> P5 ---
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13, 6], 1, Concat, [1]]                # 18  P4_out = w*down(P3_out) + w*P4_td + w*P4_in
  - [-1, 2, C3k2, [512, True]]                   # 19  P4_out  -> Detect
                                                 #     ^ 3 girisli fuzyon: BiFPN kisayolu.
                                                 #       Eski surumde [-1, 13] idi (= PANet).

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21  P5_out = w*down(P4_out) + w*P5_in
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 22  P5_out  -> Detect

  - [[16, 19, 22], 1, Detect, [nc]]              # 23
