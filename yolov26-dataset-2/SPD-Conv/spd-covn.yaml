# YOLO26n + SPDConv
# Conv patch yok. SPDConv gerçek Ultralytics modülü olarak kullanılır.

nc: 2 # crack, dent (dataset2 / ke-project-yolo-tb1l6)
      # baseline nc=2 ile egitildi; 80 birakilirsa Detect'in sinif dali shape
      # tutmaz ve baseline'in egitilmis head'i .load() sirasinda TRANSFER OLMAZ.
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]

  - [-1, 1, SPDConv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, SPDConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 1, SPDConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]

  - [-1, 1, SPDConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, SPDConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16 P3/8-small

  - [-1, 1, SPDConv, [256, 3, 2]] # 17 P3 -> P4
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19 P4/16-medium

  - [-1, 1, SPDConv, [512, 3, 2]] # 20 P4 -> P5
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]]