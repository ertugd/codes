# YOLO26n + P2 detection head + SPD-Conv + BiFPN+AFFPN HYBRID fusion
#
# Onceki "P2 head + SPD-Conv + BiFPN" yaml'inin ayni mimarisi, ama fusion
# mekanizmasi artik AYRI BiFPN patch'i degil, TEK birlesik modul:
# hybrid_fusion.py'deki HybridBiAFFPNConcat (ogrenilebilir agirlikli
# BiFPN-toplama + ECA/spatial-attention tabanli AFFPN rafinasyonu, ayni
# forward() icinde). Bu, "spd-covn+affpn+bifpn" (duzeltilmis, guvenilir
# versiyon - 92.73/86.19/91.08/67.12) ile ayni fusion felsefesini P2
# head'e tasiyor.
#
# ONEMLI: Mimaride HICBIR degisiklik yok - Concat noktalari YAML'da PLAIN
# Concat olarak kaliyor (parser-safe tasarim, oncekilerle ayni). Model
# kurulduktan SONRA apply_hybrid_fusion.py ile bu 6 Concat noktasi
# (P2 head yuzunden 4 degil 6 nokta var) HybridBiAFFPNConcat ile
# degistirilecek - gercek girdi kanal sayilari otomatik tespit edilir,
# parse_model'e hic dokunulmaz.
#
# --------------------------------------------------------------------------
# NOTEBOOK KULLANIMI:
#
#   from ultralytics import YOLO
#   from hybrid_fusion import HybridBiAFFPNConcat
#   from apply_hybrid_fusion import apply_hybrid_fusion
#
#   model = YOLO("yolo26n_p2head_spdconv_hybrid.yaml")
#   # SPDConv'u nasil register ettiysen ayni sekilde gecerli
#
#   # bu yaml'daki 6 fusion noktasi: 12, 15, 18, 21, 24, 27
#   apply_hybrid_fusion(model, layer_indices=[12, 15, 18, 21, 24, 27])
#
#   import torch
#   model.model.eval()
#   with torch.no_grad():
#       out = model.model(torch.zeros(1, 3, 640, 640))
#   print([o.shape for o in out])
#
#   model.train(
#       data="../../../YOLO.v1i.yolo26/data.yaml",
#       epochs=500, imgsz=640, batch=16, optimizer="SGD",
#       name="ablation_p2head_spdconv_hybrid_bifpn_affpn",
#   )
# --------------------------------------------------------------------------
#
# MALIYET UYARISI: P2 head (yuksek cozunurluk) + SPD-Conv (kanal genisletme)
# zaten VRAM/sure maliyetini artiriyordu. Hibrit fusion modulu her fusion
# noktasinda ek Conv projeksiyonlari + attention katmanlari icerdigi icin
# (6 nokta oldugu icin BiFPN-only versiyona gore biraz daha fazla) maliyet
# hafifce daha da artar. batch size'i izle, gerekirse dusur.
#
# Fusion noktalari (hepsi HybridBiAFFPNConcat ile degisecek):
# - Fusion-1: P5 upsample + P4 backbone    (katman 12)
# - Fusion-2: P4 upsample + P3 backbone    (katman 15)
# - Fusion-3: P3 upsample + P2 backbone    (katman 18)
# - Fusion-4: P2 downsample + P3 top-down  (katman 21)
# - Fusion-5: P3 downsample + P4 top-down  (katman 24)
# - Fusion-6: P4 downsample + P5 backbone  (katman 27)

nc: 80 # number of classes
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (SPD-Conv ile)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SPDConv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, SPDConv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 P2 backbone <-- P2 HEAD DALI BURADAN BESLENIYOR
  - [-1, 1, SPDConv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 P3 backbone
  - [-1, 1, SPDConv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 P4 backbone
  - [-1, 1, SPDConv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]     # 9
  - [-1, 2, C2PSA, [1024]]                # 10 P5 backbone

# YOLO26n head (P2 dali + SPD-Conv bottom-up + Concat placeholder'lari)
head:
  # --- Top-down: P5 -> P4 -> P3 -> P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]              # 12 fusion P5->P4 -> HybridBiAFFPNConcat
  - [-1, 2, C3k2, [512, True]]             # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]               # 15 fusion P4->P3 -> HybridBiAFFPNConcat
  - [-1, 2, C3k2, [256, True]]              # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                # 18 fusion P3->P2 -> HybridBiAFFPNConcat
  - [-1, 2, C3k2, [128, True]]               # 19 P2/4-xsmall (DETECT KAYNAGI)

  # --- Bottom-up: P2 -> P3 -> P4 -> P5 (SPD-Conv ile) ---
  - [-1, 1, SPDConv, [128, 3, 2]]              # 20 P2 -> P3
  - [[-1, 16], 1, Concat, [1]]                  # 21 fusion P2->P3 -> HybridBiAFFPNConcat
  - [-1, 2, C3k2, [256, True]]                   # 22 P3/8-small (DETECT KAYNAGI)

  - [-1, 1, SPDConv, [256, 3, 2]]                 # 23 P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                      # 24 fusion P3->P4 -> HybridBiAFFPNConcat
  - [-1, 2, C3k2, [512, True]]                       # 25 P4/16-medium (DETECT KAYNAGI)

  - [-1, 1, SPDConv, [512, 3, 2]]                      # 26 P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                           # 27 fusion P4->P5 -> HybridBiAFFPNConcat
  - [-1, 1, C3k2, [1024, True, 0.5, True]]                # 28 P5/32-large (DETECT KAYNAGI)

  - [[19, 22, 25, 28], 1, Detect, [nc]]                     # 29 Detect(P2, P3, P4, P5)