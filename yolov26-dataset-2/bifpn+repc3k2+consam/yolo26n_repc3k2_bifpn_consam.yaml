# YOLO26n V3 Dense
# RepC3k2 + BiFPN + ConSAM yoğun versiyon
#
# ConSAM: backbone + neck/head geçişlerinde
# BiFPN: 5 adet Concat noktası, Python tarafında WeightedConcat'e patch edilecek
# RepC3k2: backbone P4 + P3/P4/P5 head çıkışlarında
#
# Not:
# YAML içinde Concat ismini koruyoruz.
# Eğitim kodunda Concat -> WeightedConcat patch edilecek.

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2

  # ConSAM-1, early low-level attention
  # YOLO26n gerçek kanal yaklaşık 64
  - [-1, 1, ConSAM, [64, 3]] # 3

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5

  # ConSAM-2, P3 backbone feature
  # YOLO26n gerçek kanal yaklaşık 128
  - [-1, 1, ConSAM, [128, 3]] # 6 P3 backbone

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8

  # RepC3k2-1, P4 backbone enhancement
  # YOLO26n gerçek kanal yaklaşık 128
  - [-1, 1, RepC3k2, [128, 1, True, 0.5]] # 9

  # ConSAM-3, P4 backbone attention
  - [-1, 1, ConSAM, [128, 3]] # 10 P4 backbone

  - [-1, 1, Conv, [1024, 3, 2]] # 11-P5/32
  - [-1, 2, C3k2, [1024, True]] # 12
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 13
  - [-1, 2, C2PSA, [1024]] # 14

  # ConSAM-4, P5 backbone attention
  # YOLO26n gerçek kanal yaklaşık 256
  - [-1, 1, ConSAM, [256, 3]] # 15 P5 backbone

head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16

  # BiFPN-1
  # P5 upsample + enhanced P4 backbone
  - [[-1, 10], 1, Concat, [1]] # 17
  - [-1, 2, C3k2, [512, True]] # 18

  # ConSAM-5, top-down P4
  - [-1, 1, ConSAM, [128, 3]] # 19

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20

  # BiFPN-2
  # P4 upsample + P3 backbone
  - [[-1, 6], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22

  # ConSAM-6, P3 feature
  - [-1, 1, ConSAM, [64, 3]] # 23

  # BiFPN-3, extra P3 refinement
  # Aynı çözünürlükte P3 C3k2 output + ConSAM output birleştiriliyor
  - [[-1, 22], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [256, True]] # 25

  # RepC3k2-2, final P3 detection feature
  - [-1, 1, RepC3k2, [64, 1, True, 0.5]] # 26 P3/8-small

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 27

  # BiFPN-4
  # P3 downsample + top-down P4 feature
  - [[-1, 19], 1, Concat, [1]] # 28
  - [-1, 2, C3k2, [512, True]] # 29

  # ConSAM-7, P4 feature
  - [-1, 1, ConSAM, [128, 3]] # 30

  # RepC3k2-3, final P4 detection feature
  - [-1, 1, RepC3k2, [128, 1, True, 0.5]] # 31 P4/16-medium

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 32

  # BiFPN-5
  # P4 downsample + P5 backbone
  - [[-1, 15], 1, Concat, [1]] # 33
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 34

  # Optional P5 attention. Bu da ConSAM sayısını artırır ama çok ağır değildir.
  - [-1, 1, ConSAM, [256, 3]] # 35

  # RepC3k2-4, final P5 detection feature
  - [-1, 1, RepC3k2, [256, 1, True, 0.5]] # 36 P5/32-large

  - [[26, 31, 36], 1, Detect, [nc]] # 37 Detect(P3, P4, P5)