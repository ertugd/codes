# YOLO26n + AF-FPN (Attention Fusion FPN)
#
# Based on your YOLO26 detection YAML.
# This YAML is parser-safe for Ultralytics:
# - YAML keeps Concat at feature-fusion points.
# - In the training script, patch Concat -> AFFPN_Concat2 / AttentionFusionConcat.
#
# Why this style?
# Ultralytics parse_model handles multi-input Concat specially.
# If a new custom module name is inserted directly at [[-1, 6], ...],
# some versions can raise: list indices must be integers or slices, not list.
# Keeping Concat avoids that and lets Python provide AF-FPN behavior.
#
# AF-FPN placement:
# - AF-FPN-1: P5 upsample + P4 backbone
# - AF-FPN-2: P4 upsample + P3 backbone
# - AF-FPN-3: P3 downsample + P4 top-down
# - AF-FPN-4: P4 downsample + P5 backbone
#
# No other custom modules are used here.

nc: 80 # number of classes
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3 backbone
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 P5 backbone

# YOLO26n head with AF-FPN fusion points
head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11

  # AF-FPN-1: P5 upsample + P4 backbone
  # Keep Concat here, patch Concat -> AF-FPN attention fusion in Python.
  - [[-1, 6], 1, Concat, [1]] # 12 AF-FPN fusion P5->P4
  - [-1, 2, C3k2, [512, True]] # 13 P4 top-down

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14

  # AF-FPN-2: P4 upsample + P3 backbone
  - [[-1, 4], 1, Concat, [1]] # 15 AF-FPN fusion P4->P3
  - [-1, 2, C3k2, [256, True]] # 16 P3/8-small

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 17

  # AF-FPN-3: P3 downsample + P4 top-down
  - [[-1, 13], 1, Concat, [1]] # 18 AF-FPN fusion P3->P4
  - [-1, 2, C3k2, [512, True]] # 19 P4/16-medium

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 20

  # AF-FPN-4: P4 downsample + P5 backbone
  - [[-1, 10], 1, Concat, [1]] # 21 AF-FPN fusion P4->P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
