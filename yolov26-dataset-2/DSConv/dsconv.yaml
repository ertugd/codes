# YOLO26n + DySnakeConv (sadece bu modul, ablasyon icin izole)
#
# Baseline YOLO26n mimarisi degistirilmedi (standart Conv + standart Concat).
# Tek ekleme: P3 ciktisinin hemen sonrasina DySnakeConv katmani.
# Boylece DySnakeConv'un tek basina etkisini diger modullerden (SPDConv,
# BiFPN) izole sekilde olculebilirsin.
#
# dsconv.py icindeki DySnakeConv sinifini notebook'ta register etmeyi unutma.

nc: 80 # number of classes
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (standart, degisiklik yok)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4 P3 backbone
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6 P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10 P5 backbone

# YOLO26n head (standart, tek ekleme: DySnakeConv P3'te)
head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]             # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]            # 13 P4 top-down

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]             # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]            # 16 P3/8-small (raw)

  # Tek ozel modul: DySnakeConv - ince/kivrimli crack yapisi rafinasyonu
  #
  # ONEMLI: DySnakeConv Ultralytics tarafindan "taninmayan" bir modul oldugu
  # icin parse_model, ch[f]'i otomatik c1 olarak enjekte ETMEZ; YAML'daki
  # args'i oldugu gibi constructor'a gecirir (DySnakeConv(*args)). Ayrica
  # taninmayan moduller icin parse_model cikis kanalini "degismemis" sayar
  # (c2 = ch[f]). Bu yuzden:
  #   1) args'a c1'i BIZ elle yaziyoruz: [c1, c2, k]
  #   2) c1 == c2 olmali (modul kanal sayisini degistirmemeli), yoksa
  #      bir sonraki katman yanlis kanal sayisiyla kurulur.
  #
  # Asagidaki 64 degeri scale "n" (width=0.25) icin P3 head ciktisinin
  # gercek kanal sayisidir: C3k2[256,...] * width(0.25) = 64.
  # Baska bir scale kullanacaksan (s/m/l/x) bu sayiyi degistirmen gerekir:
  #   n: 64   | s: 128  | m: 256  | l: 256  | x: 384
  - [-1, 1, DySnakeConv, [64, 64, 3]]     # 17 P3/8-small (snake-refined) <-- DETECT KAYNAGI

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]            # 18
  - [[-1, 13], 1, Concat, [1]]            # 19 cat head P4
  - [-1, 2, C3k2, [512, True]]            # 20 P4/16-medium

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]            # 21
  - [[-1, 10], 1, Concat, [1]]            # 22 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 P5/32-large

  - [[17, 20, 23], 1, Detect, [nc]]       # 24 Detect(P3, P4, P5)