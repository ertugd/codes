# YOLO26n + AF-FPN (Attention Fusion FPN)
#
# Baseline (duz yolo26n) ile TEK fark neck'teki fuzyon islemi:
#   duz `Concat`  ->  dikkat-agirlikli fuzyon (affpn.py / AFFPNConcat2)
# Topoloji, backbone, derinlik/genislik carpanlari, head kanallari ve Detect
# baseline ile BIREBIR AYNI. Boylece ablasyonun tek degiskeni "dikkat fuzyonu"
# olur.
#
# NOT (BiFPN ile kiyas): BIFPN/bifpn.yaml ayrica P4 cikisina backbone
# kisayolu (3 girisli fuzyon) ekler. Burada TOPOLOJI KASITLI OLARAK
# DEGISTIRILMEDI - aksi halde affpn vs bifpn karsilastirmasi iki degiskenli
# olurdu. Her ikisi de baseline'a karsi tek degiskenli kalir.
#
# YAML'da `Concat` ismi neden korunuyor:
# Ultralytics parse_model kanal hesabini `elif m is Concat:
# c2 = sum(ch[x] for x in f)` dalindan yapar. Buraya yeni bir modul adi
# yazilirsa `else: c2 = ch[f]` dalina duser ve kanal sayisi yanlis hesaplanir.
# Bu yuzden isim korunur, davranis Python tarafinda baglanir:
#     from affpn import patch_concat_to_affpn
#     patch_concat_to_affpn()          # YOLO(...) cagrisindan ONCE
#
# Fuzyon noktalari (hepsi 2 girisli):
#   AF-FPN-1 (12): P5 upsample   + P4 backbone
#   AF-FPN-2 (15): P4 upsample   + P3 backbone
#   AF-FPN-3 (18): P3 downsample + P4 top-down
#   AF-FPN-4 (21): P4 downsample + P5 backbone

nc: 2 # crack, dent (dataset2 / ke-project-yolo-tb1l6)
      # baseline nc=2 ile egitildi; burada 80 birakilirsa Detect'in sinif
      # dali shape tutmaz ve baseline'in egitilmis head'i .load() sirasinda
      # TRANSFER OLMAZ.
end2end: True # YOLO26 end-to-end mode
reg_max: 1 # DFL bins

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (baseline ile birebir ayni)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3 backbone
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 P5 backbone

# YOLO26n head - PANet topolojisi, fuzyon noktalarinda dikkat-agirlikli concat
head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 AF-FPN-1
  - [-1, 2, C3k2, [512, True]] # 13 P4 top-down

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 AF-FPN-2
  - [-1, 2, C3k2, [256, True]] # 16 P3/8-small

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 AF-FPN-3
  - [-1, 2, C3k2, [512, True]] # 19 P4/16-medium

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 AF-FPN-4
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
