# YOLO26n + SPDConv + BiFPN + ECA
#
# IMPORTANT:
# 1) SPDConv must be added as a real Ultralytics module, not monkey-patched over Conv.
# 2) BiFPN is applied by keeping Concat in YAML and patching Concat -> WeightedConcat in the training script.
# 3) ECA must be registered/imported before model construction.
#
# Module placement:
# - SPDConv replaces stride=2 downsampling Conv layers.
# - BiFPN is used at all multi-scale fusion Concat points through Python patching.
# - ECA is applied to P3, P4, and P5 detection features.

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, SPDConv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, SPDConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2

  - [-1, 1, SPDConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3 backbone

  - [-1, 1, SPDConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 P4 backbone

  - [-1, 1, SPDConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 P5 backbone

head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11

  # BiFPN-1: P5 upsample + P4 backbone
  # Keep Concat in YAML. Training script patches Concat -> WeightedConcat.
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, True]] # 13 P4 top-down

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14

  # BiFPN-2: P4 upsample + P3 backbone
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 P3/8-small

  # ECA-1 on P3 detection feature
  - [-1, 1, ECA, [3]] # 17 P3 + ECA

  # Bottom-up P3 -> P4
  - [-1, 1, SPDConv, [256, 3, 2]] # 18

  # BiFPN-3: P3 downsample + P4 top-down
  - [[-1, 13], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [512, True]] # 20 P4/16-medium

  # ECA-2 on P4 detection feature
  - [-1, 1, ECA, [3]] # 21 P4 + ECA

  # Bottom-up P4 -> P5
  - [-1, 1, SPDConv, [512, 3, 2]] # 22

  # BiFPN-4: P4 downsample + P5 backbone
  - [[-1, 10], 1, Concat, [1]] # 23
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 P5/32-large

  # ECA-3 on P5 detection feature
  - [-1, 1, ECA, [3]] # 25 P5 + ECA

  - [[17, 21, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
